# XPath expressions for parsing SUMO XML output files generated each episode.
#
# Keeping queries here rather than hardcoded in parsing/sumo_outputs.py
# leads to better organization and makes it more scalable
#
# Consumed by: parsing/sumo_outputs.py (loaded once at module import)
#
# Sections
# --------
# statistics  — episode-level aggregates from statistics.xml
# vehroute    — per-vehicle, per-edge exit times from vehroute.xml
# tripsinfo   — per-vehicle trip summary from tripsinfo.xml
# fcd         — XY trajectory data from fcd-export.xml 
# edgedata    — per-edge density from edgedata.xml 

metrics:
  statistics:
    mean_travel_time: "//vehicleTripStatistics/@duration"
    mean_route_length: "//vehicleTripStatistics/@routeLength"
    mean_speed: "//vehicleTripStatistics/@speed"
    mean_time_loss: "//vehicleTripStatistics/@timeLoss"
    total_travel_time: "//vehicleTripStatistics/@totalTravelTime"
  vehroute:
    vehicles: "//vehicle/@id"
    routes: "//vehicle/route/@edges"
    exit_times: "//vehicle/route/@exitTimes"
  tripsinfo:
    vehicles: "//tripinfo/@id"
    arrivals: "//tripinfo/@arrival"
    durations: "//tripinfo/@duration"
    route_lengths: "//tripinfo/@routeLength"
    time_losses: "//tripinfo/@timeLoss"
  fcd: 
    timesteps: "//timestep"
    vehicle: "vehicle"
  edgedata:
    id: "//edge/@id"
    density: "//edge/@density"
