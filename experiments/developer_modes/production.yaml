configuration_name:
  config_name: production

randomness:
  seed: 42

numerical_constants:
  epsilon: 1.0e-8

learning:
  learning_rate: 0.3
  memory_level: 1

simulation:
  simulation_time: 3600
  warm_up_time: 300
  min_distance_factor: 0.8
  maxtries: 1000

network_path:
  # network: "/home/miguel/6.Projects/Thesis/sumo/net/Koh/1st.net.xml"
  network: "/home/miguel/6.Projects/Thesis/sumo/net/Popular/Sioux_Falls.net.xml"

duarouter:
  routing_algorithm: "CH"
