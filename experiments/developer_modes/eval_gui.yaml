configuration_name:
  config_name: eval_gui

randomness:
  seed: 42

numerical_constants:
  epsilon: 1.0e-8

learning:
  learning_rate: 0.3
  memory_level: 1

simulation:
  warm_up_time: 6
  simulation_time: 36
  min_distance_factor: 0.8
  maxtries: 1000

network_path:
  # network: "/home/miguel/6.Projects/Thesis/sumo/net/Koh/1st.net.xml"
  network: "/home/miguel/6.Projects/Thesis/sumo/net/Popular/Sioux_Falls.net.xml"

duarouter:
  routing_algorithm: "CH"
  random_factor: 5
  max_attempts: 25
  n_threads: 7
  n_routes_per_OD: 3

stopping_rule:
