randomtrips:
  max_size_od_space: 10
  fringe_factor: 5

due_convergence: 
  threshold_density: 10
  duaIterate_max_iterations: 2
  duaIterate_step_length: 0.1

mode_and_flags:
  have_precomputed_routes: false
  last_episode_gui_BM: false
  last_episode_gui_duaIterate: false
