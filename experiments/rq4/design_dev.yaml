# RQ4 (dev-scale) — Temporal link degradation and equilibrium recovery
#
# Fast smoke-test variant of experiments/rq4/design.yaml: single seed, single
# n_agents, base_dev.yaml's shorter simulation_time/warm_up_time, and
# max_episodes scaled down to 300 (100 normal / 100 degraded / 100 restored,
# degradation_start_episode=101, degradation_end_episode=201). Used to
# confirm the network swap actually fires and shifts travel time on the
# degraded edge before committing to the full overnight run. See
# design.yaml for the research question and mechanism.

base_config: /home/miguel/6.Projects/Thesis/experiments/base_dev.yaml

grid:
  learning:
    memory_level: 
      - 0.8
  network_path:
    network:
      - "/home/miguel/6.Projects/Thesis/experiments/rq4/net/Sioux_Falls.net.xml"
    network_normal:
      - "/home/miguel/6.Projects/Thesis/experiments/rq4/net/templates/Normal_Sioux_Falls.net.xml"
    network_degraded:
      # - "/home/miguel/6.Projects/Thesis/experiments/rq4/net/templates/25km_h_Degraded_10-15_Sioux_Falls.net.xml"
      # - "/home/miguel/6.Projects/Thesis/experiments/rq4/net/templates/25km_h_Degraded_10-11_10-15_Sioux_Falls.net.xml"
      # - "/home/miguel/6.Projects/Thesis/experiments/rq4/net/templates/10km_h_Degraded_10-11_10-15_Sioux_Falls.net copy.xml"
      - "/home/miguel/6.Projects/Thesis/experiments/rq4/net/templates/10km_h_Degraded_10-15_Sioux_Falls.net.xml"
  stopping_rule:
    max_episodes:
      - 300
    k_no_change:
      - 5000
    degradation_start_episode: 
      - 101
    degradation_end_episode:
      - 201

  randomness:
    seed:
      - 42
      # - 5
      # - 23
      # - 1999
      # - 8
  demand:
    n_agents:
      - 155
  
  due_convergence: 
    duaIterate_max_iterations: 
      - 1